[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-tasks"
version = "0.1.0"
description = "Human-first workspaces for reusable, task-scoped browser automation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Anton Bykov"}]
keywords = ["browser-automation", "agents", "task-orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
# The documented validation command needs pytest; it was never declared.
dev = ["pytest>=8"]

[project.scripts]
browser-tasks = "browser_tasks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
